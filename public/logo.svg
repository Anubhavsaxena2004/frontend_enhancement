<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 560" fill="none">
  <defs>
    <linearGradient id="navBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="60%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="goldDot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#EAB308" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1E3A8A" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <g filter="url(#softShadow)">
    <!-- Main N shape path -->
    <path d="M 120 440 
             C 95 440 80 420 80 395 
             L 80 145 
             C 80 120 95 100 120 100 
             C 140 100 155 112 170 135 
             L 285 305 
             L 285 200 
             C 285 180 300 170 320 170 
             C 340 170 355 185 355 205 
             L 355 395 
             C 355 420 340 440 315 440 
             C 295 440 280 428 265 405 
             L 150 235 
             L 150 395 
             C 150 420 135 440 120 440 Z" 
          fill="url(#navBlue)" />
    
    <!-- Top Right Accent Dot -->
    <circle cx="328" cy="115" r="36" fill="url(#goldDot)" stroke="#D97706" stroke-width="2" />
  </g>
</svg>
